  --accent: #3442c9;
  --accent-soft: #e3e6fb;

  --have-soft: #dff3e8;
  --miss: #c23b3b;
  --miss-soft: #fbe5e5;
  --pocket: #e4e8ef;

* { box-sizing: border-box; }
body {

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

button { font: inherit; color: inherit; }

header.bar {

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.total strong { color: var(--fg); font-size: 15px; }
.search { position: relative; }
.search input {

  border: 2px solid var(--line); background: var(--page); color: var(--fg);
}
.search input:focus { border-color: var(--accent); outline: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 20px; width: 36px; height: 36px; color: var(--muted); cursor: pointer; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {

.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--page); }
.chip.mode[aria-pressed="true"] { background: var(--have); border-color: var(--have); }
.tools .spacer { flex: 1; }
.setsel { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--page); color: var(--fg); max-width: 100%; }

.series span { font-family: var(--font-num); font-size: 12px; color: var(--muted); }

.official { font-size: 14px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.notice { font-size: 13px; color: var(--muted); background: var(--page); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
.notice[data-kind="mode"] { border-style: solid; border-color: var(--have); color: var(--fg); background: var(--have-soft); }

.hit .nm { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.3; }
.hit .meta { font-size: 12px; color: var(--muted); }

.verdict.yes { background: var(--have-soft); color: var(--have); }
.verdict.no { background: var(--miss-soft); color: var(--miss); }

.set-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.set-head h3 { font-family: var(--font-display); font-weight: 800; font-size: 19px; margin: 0; text-wrap: balance; }
.set-head .code { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.set-head .count { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; grid-row: span 2; align-self: center; }

.meter { height: 8px; background: var(--pocket); border-radius: 99px; overflow: hidden; margin: 12px 0 14px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.meter.done i { background: var(--have); }
.badge-done { font-size: 12px; font-weight: 600; color: var(--have); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); } }
.pocket { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; display: grid; gap: 4px; min-width: 0; }
.face {

  background: var(--pocket); border: 2px dashed var(--pocket-ink); display: grid; place-items: center;

.face .no { font-family: var(--font-num); font-size: 13px; color: var(--pocket-ink); }
.face .sil { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--pocket-ink); opacity: .6; }
.face.own { border: 0; background: var(--tc, var(--s-sv)); }
.face.own::after { content: ""; position: absolute; inset: 0; background: linear-gradient(150deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%, rgba(0,0,0,.18)); pointer-events: none; }

  ["SV5M","サイバージャッジ","拡張","sv",72,"071",45544,"ダーテング|シキジカ|メブキジカ|ニャビー|デンヂムシ|テツノイバラ|アブリー|ドリュウズ|メタグロス|メルタン|ベロリンガ|ジジーロン"],
  ["SV5K","ワイルドフォース","拡張","sv",72,"071",45515,"ハヤシガメ|ユキハミ|ドーミラー|ランクルス|ハバタクカミ|ジーランス|バンバドロ|アーボック|ゴース|ペラップ|チラーミィ|チラチーノ"],

  ["SV4K","古代の咆哮","拡張","sv",67,"066",44420,"イワパレス|ブビィ|コソクムシ|ミガルーサ|サケブシッポ|コジョンド|キョジオーン|チヲハウハネ|ダストダス|モルペコ|アラブルタケ|ドゴーム"],
  ["SV3a","レイジングサーフ","強化拡張","sv",63,"062",44379,"ユキワラシ|タマンタ|プラスル|マイナン|バチュル|コレクレー|グラードン|メテノ|イベルタル|ナットレイ|ギルガルド|モトトカゲ"],
  ["SV3","黒炎の支配者","拡張","sv",109,"108",44135,"クサイハナ|キュウコン|イルカマン|ハラバリー|ピィ|ヨーギラス|デルビル|ハッサム|ブロロン|ポッポ|ピジョン|グルトン"],
  ["SV2a","ポケモンカード151","強化拡張","sv",166,"165",43951,"フシギダネ|フシギソウ|ヒトカゲ|リザード|ゼニガメ|カメール|キャタピー|ピカチュウ|ニドキング|コダック|ニョロゾ|ゴーリキー|モンジャラ|バリヤード|オムナイト|カビゴン|ハクリュー|ミュウツー"],
  ["SV2D","クレイバースト","拡張","sv",72,"071",43640,"ヘラクロス|ヒノヤコマ|ライチュウ|スナバァ|カヌチャン|ナカヌチャン|コジオ|バンギラス|タギングル|イッカネズミ|カラミンゴ|リキキリン"],
  ["SV2P","スノーハザード","拡張","sv",72,"071",43665,"アノクサ|マリル|コオリッポ|セビエ|セゴール|セグレイブ|ゴチミル|ベラカス|ウソッキー|ミミズズ|ココガラ|ノココッチ"],
  ["SV1a","トリプレットビート","強化拡張","sv",74,"073",43279,"トロピウス|ニャオハ|ニャローテ|カエンジシ|ホゲータ|アチゲータ|コイキング|クワッス|ウェルカモ|ムウマージ|パルデア ケンタロス|パルデア ウパー"],
  ["SV1V","バイオレットex","拡張","sv",79,"078",43066,"タマンチュラ|ノノクラゲ|スコヴィラン|ヤドン|ウデッポウ|パチリス|パーモット|スリープ|ボチ|マフィティフ|オトシドリ|ホシガリス"],
  ["SV1S","スカーレットex","拡張","sv",79,"078",43039,"オリーニョ|グレンアルマ|ウミディグダ|ヘイラッシャ|ラルトス|キルリア|パピモッチ|リオル|メグロコ|ガケガニ|ドドゲザン|ムックル"],
  ["S12a","VSTARユニバース","ハイクラス","swsh",173,"172",42823,"ヒスイ ビリリダマ|コロトック|ブーバーン|オドリドリ|ラプラス|マナフィ|ケルディオ|エレキブル|ストリンダー|ガラル フリーザー|ミュウ|ルナトーン|デオキシス|ディアンシー|キュワワー|ガラル サンダー|ソルロック|ガラル ファイヤー|アブソル|フォクスライ|ジバコイル|チルタリス|ラティアス|ヒスイ ヌメルゴン|メタモン|ノコッチ|ミルタンク|ビーダル|リオル|チルット|ヨマワル|ビッパ|ピカチュウ|ナエトル|パラス|ポチエナ|メリープ"],
];

const SETS = SET_ROWS.map(([code, name, kind, series, first, total, firstId, names]) =>
  ({ code, name, kind, series: SERIES.find(s => s.key === series), first, total, firstId, names: names.split("|") }));

const CARDS = [];
for (const s of SETS) s.names.forEach((name, i) => {
  const no = String(s.first + i).padStart(3, "0");
  CARDS.push({ id: `${s.code.replace(/^SV/, "sv")}-${no}`, set: s, no, name, label: `${no}/${s.total}`, official: s.firstId + i, imageUrl: "" });
});
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));

const norm = t => (t || "").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).replace(/[\s・ー\-]/g, "");
for (const c of CARDS) c.key = norm(c.name);

// ---------- State & Supabase Data Store ----------
const LS_KEY = "arzukan.v1";
const state = { owned: {}, filter: "all", quick: false, q: "", backend: "loading" };

const store = {
  async init() {
    if (!supabase) {
      useLocal("Supabaseクライアントの初期化に失敗したため、端末に保存しています。");
      return;
    }

    try {
      // 1. Supabaseから全カードの登録データ（所持状況・画像URL）を取得
      const { data, error } = await supabase
        .from('cards')
        .select('*')
        .limit(1000);

      if (error) throw error;

      const next = {};
      (data || []).forEach(row => {
        // カード名と画像URLの突き合わせ
        const matched = CARDS.find(c => c.name === row.name && !c.imageUrl);
        if (matched) {
          matched.imageUrl = row.image_url;
          matched.dbId = row.id;
        }

        // 所持状況のマッピング
        const targetCard = CARDS.find(c => c.name === row.name);
        if (targetCard) {
          next[targetCard.id] = {
            count: row.is_owned ? 1 : 0,
            wish: row.is_wish || false,
            memo: row.memo || "",
            dbId: row.id,
            imageUrl: row.image_url
          };
        }
      });

      state.owned = next;
      state.backend = "supabase";
      setNotice();
      render();
    } catch (e) {
      console.error(e);
      useLocal("クラウド接続エラーのため、この端末のデータを使用しています。");
    }
  },

  pending: {},
  write(id) {
    const rec = state.owned[id];
    saveLocal(); // ローカルフォールバック保存も並行

    if (state.backend !== "supabase" || !supabase) return;

    clearTimeout(this.pending[id]);
    this.pending[id] = setTimeout(async () => {
      const card = byId[id];
      try {
        const payload = {
          is_owned: (rec && rec.count > 0),
          updated_at: new Date().toISOString()
        };

        if (rec.dbId) {
          await supabase.from('cards').update(payload).eq('id', rec.dbId);
        } else {
          await supabase.from('cards').update(payload).eq('name', card.name);
        }
      } catch (err) {
        toast("保存できませんでした。通信環境を確認してください。");
      }
    }, 400);
  }
};

function useLocal(msg) {
  state.backend = "local";
  try { state.owned = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { state.owned = {}; }
  toast(msg);
  setNotice();
  render();
}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state.owned)); } catch {}
}

function setNotice() {
  const n = document.getElementById("notice");
  if (state.quick) { n.hidden = true; return; }
  n.dataset.kind = "";
  if (state.backend === "local") n.hidden = true;
  else if (state.backend === "supabase") {
    n.hidden = !!Object.keys(state.owned).length;
    n.textContent = "カードをタップして所持状況を登録できます。";
  }
}

// ---------- helpers ----------
const rec = id => state.owned[id] || { count: 0 };
const has = id => rec(id).count > 0;
function setRec(id, patch) {
  const next = { ...rec(id), ...patch, updatedAt: new Date().toISOString() };
  if (next.count < 0) next.count = 0;
  state.owned[id] = next;
  store.write(id);
  render();
  if (openId === id) renderSheet();
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));

function cardImgSrc(c) {
  const r = rec(c.id);
  if (r.imageUrl) return r.imageUrl;
  if (c.imageUrl) return c.imageUrl;
  // Supabase Storageの命名形式に即したフォールバックURL
  return `${STORAGE_BUCKET_BASE}${encodeURIComponent(c.name)}.jpg`;
}

function faceHTML(c, extraCls = "") {
  const r = rec(c.id), wish = r.wish ? `<span class="wish">★</span>` : "";
  const imgSrc = cardImgSrc(c);
  const imgTag = `<img src="${esc(imgSrc)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none'">`;

  if (r.count > 0) {
    return `<div class="face own ${extraCls}" style="--tc: var(${c.set.series.color})">${imgTag}<span class="got">✓</span>${r.count > 1 ? `<span class="qty">×${r.count}</span>` : ""}${wish}</div>`;
  }
  return `<div class="face art ${extraCls}">${imgTag}<span class="tag">未所持</span>${wish}</div>`;
}

let toastT;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200);
}

// ---------- render ----------
function render() {
  const total = CARDS.length, got = CARDS.filter(c => has(c.id)).length;
  document.getElementById("total").innerHTML = `<strong>${got}</strong> / ${total} 枚 · ${Math.round(got / total * 100)}%`;
  const main = document.getElementById("main");
  if (state.q) {
    const q = norm(state.q), qn = state.q.replace(/\D/g, "");
    const hits = CARDS.filter(c => c.key.includes(q) || (qn && (c.no.includes(qn.padStart(3, "0")) || c.no.replace(/^0+/, "") === qn)));
    main.innerHTML = hits.length ? `<div class="results">${hits.map(c => {
      const r = rec(c.id);
      return `<button class="hit" data-id="${c.id}"><div class="mini">${faceHTML(c)}</div>
        <div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.set.name)} · ${c.label}</div></div>
        ${r.count > 0 ? `<span class="verdict yes">✓ 持ってる${r.count > 1 ? `（${r.count}枚）` : ""}</span>` : `<span class="verdict no">✕ 持ってない</span>`}</button>`;
    }).join("")}</div>` : `<p class="empty">「${esc(state.q)}」に当てはまるARは、収録中の${SETS.length}弾にありません。</p>`;
    return;
  }
  const sets = SETS.filter(s => !state.set || s.code === state.set);
  main.innerHTML = SERIES.map(sr => {
    const inSeries = sets.filter(s => s.series === sr);
    if (!inSeries.length) return "";
    const sc = CARDS.filter(c => c.set.series === sr), sg = sc.filter(c => has(c.id)).length;
    return `<div class="series" style="--sc: var(${sr.color})"><h2>${esc(sr.name)}</h2><span>${sg} / ${sc.length}</span></div>` + inSeries.map(setHTML).join("");
  }).join("");
}

function setHTML(s) {
  const keep = c => state.filter === "all" || (state.filter === "have" && has(c.id)) || (state.filter === "missing" && !has(c.id)) || (state.filter === "wish" && rec(c.id).wish);
  const cs = CARDS.filter(c => c.set === s), g = cs.filter(c => has(c.id)).length, shown = cs.filter(keep);
  const done = g === cs.length;
  return `<section class="set" aria-label="${esc(s.name)}">
    <div class="set-head"><h3>${esc(s.name)}<span class="kind">${s.kind}</span></h3><div class="count"><strong>${g}</strong> / ${cs.length}</div>
    <div class="code">${s.code} · AR ${cs.length}種 ${done ? `<span class="badge-done">· コンプリート！</span>` : ""}</div></div>
    <div class="meter ${done ? "done" : ""}"><i style="width:${g / cs.length * 100}%"></i></div>
    ${shown.length ? `<div class="grid">${shown.map(c => `<button class="pocket ${has(c.id) ? "" : "missing"}" data-id="${c.id}" aria-label="${esc(c.name)} ${c.label} ${has(c.id) ? "所持" : "未所持"}">
      ${faceHTML(c)}<div class="lbl">${esc(c.name)}<span>${c.label}</span></div></button>`).join("")}</div>`
      : `<p class="small">この条件に当てはまるカードはありません。</p>`}
  </section>`;
}

// ---------- detail sheet ----------
let openId = null;
function openSheet(id) { openId = id; renderSheet(); }
function closeSheet() { openId = null; document.getElementById("sheetRoot").innerHTML = ""; }

function renderSheet() {
  const c = byId[openId], r = rec(openId);
  const imgSrc = cardImgSrc(c);
  document.getElementById("sheetRoot").innerHTML = `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}"><div class="sheet-in">
    <button class="big" data-act="zoom" aria-label="画像を大きく表示">${faceHTML(c)}<span class="small">タップで拡大</span></button>
    <div><h3>${esc(c.name)}</h3><div class="meta">${esc(c.set.name)}（${c.set.code}）<br>${c.label} · AR</div>
      <p><a class="official" href="https://www.pokemon-card.com/card-search/details.php/card/${c.official}/regu/all" target="_blank" rel="noopener">公式サイトでカードを見る</a></p>
      <div class="state">${r.count > 0 ? `<span class="verdict yes">✓ 持ってる</span>` : `<span class="verdict no">✕ 持ってない</span>`}</div></div>
    <div class="controls">
      <div class="row">
        <span class="small">枚数</span><span class="stepper"><button data-act="minus" aria-label="1枚減らす" ${r.count > 0 ? "" : "disabled"}>−</button><output>${r.count}</output><button data-act="plus" aria-label="1枚増やす">＋</button></span>
        <button class="btn" data-act="wish" aria-pressed="${!!r.wish}">${r.wish ? "★ 欲しい解除" : "☆ 欲しい"}</button>
      </div>
      <textarea class="memo" id="memo" placeholder="メモ（例：美品・〇〇ショップで購入）">${esc(r.memo || "")}</textarea>
      <button class="btn" data-act="close">閉じる</button>
    </div>
  </div></div>`;
}

// ---------- events ----------
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-filter]");
  if (chip) { state.filter = chip.dataset.filter; document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === chip)); render(); return; }
  if (e.target.closest("#quick")) { state.quick = !state.quick; document.getElementById("quick").setAttribute("aria-pressed", state.quick); setNotice(); return; }
  if (e.target.closest("#clear")) { const q = document.getElementById("q"); q.value = ""; state.q = ""; document.getElementById("clear").hidden = true; render(); q.focus(); return; }
  const card = e.target.closest(".pocket, .hit");
  if (card) {
    const id = card.dataset.id;
    if (state.quick && card.classList.contains("pocket")) { const now = !has(id); setRec(id, { count: now ? Math.max(1, rec(id).count) : 0 }); }
    else openSheet(id);
    return;
  }
  const act = e.target.closest("[data-act]")?.dataset.act; if (!act || !openId) return;
  if (act === "unzoom") { closeZoom(); return; }
  if (act === "zoom") { openZoom(openId); return; }
  const r = rec(openId);
  if (act === "close") closeSheet();
  else if (act === "plus") setRec(openId, { count: r.count + 1 });
  else if (act === "minus") setRec(openId, { count: r.count - 1 });
  else if (act === "wish") setRec(openId, { wish: !r.wish });
});

document.addEventListener("change", e => {
  if (e.target.id !== "memo" || !openId) return;
  state.owned[openId] = { ...rec(openId), memo: e.target.value.trim(), updatedAt: new Date().toISOString() };
  store.write(openId);
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("zoomRoot").innerHTML) closeZoom(); else if (openId) closeSheet();
});

function openZoom(id) {
  const c = byId[id], r = rec(id);
  const imgSrc = cardImgSrc(c);
  document.getElementById("zoomRoot").innerHTML = `<div class="zoom" data-act="unzoom" role="dialog" aria-modal="true" aria-label="${esc(c.name)}の拡大表示">
    <div class="zoom-card"><img src="${esc(imgSrc)}" alt="${esc(c.name)}"></div>
    <div class="zoom-cap"><b>${esc(c.name)}</b> ${c.label} ${r.count > 0 ? "✓ 持ってる" : "✕ 持ってない"}<br><span style="opacity:.7">画面をタップすると戻ります</span></div></div>`;
}

function closeZoom() { document.getElementById("zoomRoot").innerHTML = ""; }

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); document.getElementById("clear").hidden = !state.q; render(); });

const setSel = document.getElementById("setSel");
setSel.insertAdjacentHTML("beforeend", SETS.map(s => `<option value="${s.code}">${esc(s.name)}（${s.code}）</option>`).join(""));
setSel.addEventListener("change", () => { state.set = setSel.value; render(); window.scrollTo(0, 0); });

// hide the search bar while scrolling
const bar = document.querySelector("header.bar"), qInput = document.getElementById("q");
let lastY = window.scrollY;
window.addEventListener("scroll", () => {
  const y = window.scrollY, d = y - lastY;
  if (Math.abs(d) < 6) return;
  bar.classList.toggle("hide", d > 0 && y > bar.offsetHeight && document.activeElement !== qInput);
  lastY = y;
}, { passive: true });

render();
store.init();
</script>
